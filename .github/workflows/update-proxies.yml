name: Update, Clean and Ping Proxies

on:
  push:
    paths:
      - 'trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-list:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process, Ping and Generate JSON
        run: |
          mkdir -p proxy_lists
          
          # Скачиваем новые базы и ставим принудительные переносы строк (защита от склеивания)
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt > proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/Vless-Reality-White-Lists-Rus-Mobile.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Splitted-By-Protocol/trojan.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/6.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/24.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/7.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/AvenCores/goida-vpn-configs/refs/heads/main/githubmirror/22.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Splitted-By-Protocol/vmess.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/Epodonios/v2ray-configs/refs/heads/main/Splitted-By-Protocol/ss.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_universal.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/zieng2/wl/refs/heads/main/vless_lite.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS_WEAK_DPI_RUS.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/refs/heads/main/data/githubmirror/ru-sni/vless.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-checked.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/refs/heads/main/data/githubmirror/ru-sni/hy2.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/refs/heads/main/data/githubmirror/ru-sni-local/vless.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/refs/heads/main/data/githubmirror/ru-sni/trojan.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/refs/heads/main/data/githubmirror/ru-sni/ss.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          curl -s https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/refs/heads/main/data/githubmirror/ru-sni/hysteria2.txt >> proxy_lists/raw_temp.txt
          echo "" >> proxy_lists/raw_temp.txt
          
          cat << 'EOF' > filter.py
          import urllib.request, json, re, socket, urllib.parse, base64, html, os, time
          from concurrent.futures import ThreadPoolExecutor

          print("📂 Загрузка баз...")
          lines = []
          
          with open('proxy_lists/raw_temp.txt', 'r', encoding='utf-8') as f:
              raw_content = f.read().splitlines()

          new_lines = []
          for line in raw_content:
              line = line.strip()
              if not line: continue
              
              if '://' not in line and len(line) > 30:
                  try:
                      padded = line + "=" * ((4 - len(line) % 4) % 4)
                      decoded_text = base64.urlsafe_b64decode(padded).decode('utf-8')
                      new_lines.extend(decoded_text.splitlines())
                  except:
                      new_lines.append(line)
              else:
                  new_lines.append(line)

          lines.extend([l for l in new_lines if l.strip()])
          print(f"   📥 Распаковано свежих ссылок: {len(lines)}")

          # 💾 Поднятие старого золотого запаса из списков Sing-box, Clash и iOS
          for gold_file in ['proxy_lists/fixed_proxies.txt', 'proxy_lists/fixed_proxies_hy.txt', 'proxy_lists/fixed_proxies_clash.txt', 'proxy_lists/fixed_proxies_ios.txt']:
              if os.path.exists(gold_file):
                  with open(gold_file, 'r', encoding='utf-8') as f:
                      old_lines = [l.strip() for l in f.readlines() if l.strip() and not l.startswith('#')]
                      lines.extend(old_lines)
                  print(f"   🛡️ Из {gold_file} добавлено: {len(old_lines)} ссылок")

          ss_converted_lines = []
          for line in lines:
              line = re.sub(r'[\x00-\x1F\x7F]', '', line).strip()
              if not line or line.startswith('#'): continue
              
              line = line.replace('&amp;', '&').replace('&amp%3B', '&').replace('%3B', ';').replace('&;', '&').replace('?amp;', '?')
              line = html.unescape(line)

              parts = line.split('#')
              base_url = parts[0]
              raw_name = urllib.parse.unquote(parts[1]) if len(parts) > 1 else ""

              # Извлекаем имя из JSON vmess://, если нет #fragment на конце
              if not raw_name and base_url.startswith('vmess://'):
                  try:
                      b64_v = base_url[8:].strip()
                      b64_v += "=" * ((4 - len(b64_v) % 4) % 4)
                      v_obj = json.loads(base64.urlsafe_b64decode(b64_v).decode('utf-8'))
                      raw_name = str(v_obj.get('ps', ''))
                  except: pass

              raw_name = re.sub(r'\s*\[\d+\]$', '', raw_name)
              
              if base_url.startswith('ss://'):
                  try:
                      match = re.search(r'ss://([^@]+)@([^/?#]+)/?\?([^#]+)', base_url)
                      if match:
                          b64, hp, q = match.groups()
                          b64 += "=" * ((4 - len(b64) % 4) % 4)
                          userinfo = base64.urlsafe_b64decode(b64).decode('utf-8')
                          if userinfo.startswith('none:'):
                              uuid = userinfo.split(':', 1)[1]
                              q = urllib.parse.unquote(q)
                              opts = q.split(';') if ';' in q else urllib.parse.parse_qs(q).get('plugin', [''])[0].split(';')
                              ws_host, ws_path, tls = "", "/", "none"
                              for opt in opts:
                                  if opt.startswith('host='): ws_host = opt[5:]
                                  elif opt.startswith('path='): ws_path = opt[5:]
                                  elif opt == 'tls': tls = "tls"
                              base_url = f"vless://{uuid}@{hp}?type=ws&security={tls}&host={ws_host}&path={urllib.parse.quote(ws_path)}"
                  except: pass

              # Распаковка монолитных ss://BASE64 (где @ спрятана внутри Base64), чтобы get_host_port их не терял
              if base_url.startswith('ss://') and '@' not in base_url:
                  try:
                      b64_part = base_url[5:].split('?')[0]
                      b64_part += "=" * ((4 - len(b64_part) % 4) % 4)
                      decoded_ss = base64.urlsafe_b64decode(b64_part).decode('utf-8')
                      if '@' in decoded_ss:
                          base_url = f"ss://{decoded_ss}"
                  except: pass

              # Очистка port-hopping в Hysteria2 (оставляем основной одиночный порт вместо 443,20000-40000)
              if base_url.lower().startswith(('hysteria2://', 'hy2://')):
                  base_url = re.sub(r'(@[^/?#:]+:\d+)[,-][\d,-]+', r'\1', base_url)
                  base_url = re.sub(r'&?mport=[^&]+', '', base_url).replace('?&', '?').rstrip('?&')

              ss_converted_lines.append((base_url, raw_name))

          def get_host_port(url):
              if url.startswith('vmess://'):
                  try:
                      b64_str = url[8:]
                      b64_str += "=" * ((4 - len(b64_str) % 4) % 4)
                      v_json = json.loads(base64.urlsafe_b64decode(b64_str).decode('utf-8'))
                      return (str(v_json.get('add', '')), int(v_json.get('port', 0)))
                  except: return None
              match = re.search(r'@([^/?#]+)', url)
              if match:
                  raw_hp = match.group(1)
                  ipv6_match = re.match(r'\[(.*?)\]:(\d+)', raw_hp)
                  if ipv6_match:
                      return (ipv6_match.group(1), int(ipv6_match.group(2)))
                  hp = raw_hp.split(':')
                  if len(hp) == 2:
                      try: return (hp[0], int(hp[1]))
                      except: return None
              return None

          unique_hw_map = {}
          for base_url, raw_name in ss_converted_lines:
              hp = get_host_port(base_url)
              if hp:
                  if hp not in unique_hw_map: unique_hw_map[hp] = []
                  unique_hw_map[hp].append((base_url, raw_name))

          def fast_tcp_ping(hp):
              host, port = hp
              try:
                  ip = socket.gethostbyname(host)
              except:
                  return hp, None
              # Если на этом адресе висит UDP-протокол Hysteria2, не убиваем его при закрытом TCP-порте
              if any(u.lower().startswith(('hysteria2://', 'hy2://')) for u, _ in unique_hw_map.get(hp, [])):
                  return hp, ip
              try:
                  s = socket.create_connection((ip, port), timeout=1.5)
                  s.close()
                  return hp, ip
              except:
                  return hp, None

          print(f"⚡ TCP-пинг уникальных адресов ({len(unique_hw_map)} шт.)...")
          alive_ips = {}
          with ThreadPoolExecutor(max_workers=50) as executor:
              for hp, ip in executor.map(fast_tcp_ping, unique_hw_map.keys()):
                  if ip: alive_ips[hp] = ip

          print(f"   ✅ Выжило базовых узлов: {len(alive_ips)}")

          def get_deep_key(base_url, hp):
              try:
                  if base_url.startswith('vmess://'):
                      b64_s = base_url[8:] + "=" * ((4 - len(base_url[8:]) % 4) % 4)
                      v = json.loads(base64.urlsafe_b64decode(b64_s).decode('utf-8'))
                      return (hp[0], hp[1], str(v.get('host') or v.get('sni') or ''), str(v.get('path') or ''))
                  u = urllib.parse.urlparse(base_url)
                  q = urllib.parse.parse_qs(u.query.replace('%3B', '&').replace(';', '&'))
                  pbk = q.get('pbk', [''])[0]
                  sni = q.get('sni', [''])[0] or q.get('host', [''])[0]
                  return (hp[0], hp[1], pbk, sni)
              except:
                  return hp

          node_groups = {}
          url_to_name = {}
          deep_key_to_ip = {}

          for hp, ip in alive_ips.items():
              for base_url, raw_name in unique_hw_map[hp]:
                  deep_key = get_deep_key(base_url, hp)
                  if deep_key not in node_groups: node_groups[deep_key] = []
                  if base_url not in node_groups[deep_key]:
                      node_groups[deep_key].append(base_url)
                      url_to_name[base_url] = raw_name
                      deep_key_to_ip[deep_key] = ip

          unique_resolved_ips = list(set(alive_ips.values()))
          ip_info = {}
          print("🌍 Сбор GEO-данных...")
          for i in range(0, len(unique_resolved_ips), 100):
              try:
                  batch = unique_resolved_ips[i:i+100]
                  req = urllib.request.Request('http://ip-api.com/batch?fields=query,countryCode,country', data=json.dumps(batch).encode())
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      for r in json.loads(resp.read().decode()): ip_info[r.get('query')] = r
              except: pass
              time.sleep(1.5)

          def get_flag(c): return chr(ord(c[0]) + 127397) + chr(ord(c[1]) + 127397) if (c and len(c)==2) else "🌍"
          
          def score_link(url):
              score = 0
              if 'security=reality' in url: score += 15
              if 'pbk=' in url: score += 15
              if 'flow=xtls-rprx-vision' in url: score += 10
              if 'type=grpc' in url: score += 8
              if 'hysteria2://' in url or 'hy2://' in url: score += 7
              if 'trojan://' in url: score += 6
              if 'type=ws' in url or 'type=httpupgrade' in url: score += 5
              if 'vmess://' in url: score += 4
              return score

          def max_variants(links):
              if any('security=reality' in x for x in links): return 8
              if any(x.startswith('trojan://') for x in links): return 5
              return 3

          def remove_control_chars(obj):
              if isinstance(obj, str): return re.sub(r'[\x00-\x1F\x7F-\x9F]', '', obj)
              elif isinstance(obj, dict): return {re.sub(r'[\x00-\x1F\x7F-\x9F]', '', str(k)): remove_control_chars(v) for k, v in obj.items()}
              elif isinstance(obj, list): return [remove_control_chars(i) for i in obj]
              return obj

          def is_valid_port(port):
              try: return 1 <= int(port) <= 65535
              except: return False

          def parse_to_mihomo(link, node_name, beautiful_name):
              try:
                  link = link.strip()
                  parts = link.split('#')
                  main_part = parts[0]
                  safe_link = f"{main_part}#{urllib.parse.quote(beautiful_name)}"
                  base = None
                  
                  if main_part.startswith('vmess://'):
                      b64_str = main_part[8:]
                      b64_str += "=" * ((4 - len(b64_str) % 4) % 4)
                      v = json.loads(base64.urlsafe_b64decode(b64_str).decode('utf-8'))
                      
                      cipher_type = str(v.get("scy", "auto")).strip().lower()
                      if cipher_type in ["", "null", "none", "false", "0"]: 
                          cipher_type = "auto"
                          
                      v_net = str(v.get("net", "tcp")).strip().lower()
                      v_httpupgrade = (v_net == "httpupgrade")
                      if v_httpupgrade:
                          v_net = "ws"

                      base = {
                          "name": node_name, "type": "vmess", 
                          "server": str(v.get("add", "")), "port": int(v.get("port", 0) or 0), 
                          "uuid": str(v.get("id", "")), "alterId": int(v.get("aid", 0) or 0), 
                          "cipher": cipher_type, "network": v_net, "udp": True
                      }
                      if str(v.get("tls")) == "tls":
                          base["tls"] = True
                          base["skip-cert-verify"] = True
                          fp = v.get("fp")
                          if fp: base["client-fingerprint"] = fp
                          sni = v.get("sni") or v.get("host")
                          if sni and not re.match(r'^[\d\.]+$', str(sni)) and ':' not in str(sni):
                              base["servername"] = str(sni)
                          alpn = v.get("alpn")
                          if alpn: base["alpn"] = alpn.split(',')
                          
                      if base["network"] == "ws":
                          path = str(v.get("path", "/"))
                          if not path.startswith('/'): path = '/' + path
                          base["ws-opts"] = {"path": path}
                          if v.get("host"): base["ws-opts"]["headers"] = {"Host": str(v.get("host"))}
                          if v_httpupgrade: base["ws-opts"]["v2ray-http-upgrade"] = True
                  else:
                      u = urllib.parse.urlparse(main_part)
                      query_str = u.query.replace('%3B', '&').replace(';', '&').replace('&amp;', '&')
                      
                      def get_param(name, default=""):
                          m = re.search(r'[?&]' + name + r'=([^&]+)', '?' + query_str)
                          return urllib.parse.unquote(m.group(1)) if m else default

                      net_type = get_param('type', 'tcp').lower()
                      is_httpupgrade = (net_type == 'httpupgrade')
                      if net_type in ['raw', '']: net_type = 'tcp'
                      elif net_type == 'http': net_type = 'h2'
                      elif is_httpupgrade: net_type = 'ws'

                      base = {"name": node_name, "server": u.hostname, "port": int(u.port) if u.port else 0, "udp": True}
                      password = urllib.parse.unquote(u.username) if u.username else ""

                      if u.scheme == "trojan":
                          base.update({"type": "trojan", "password": password, "network": net_type})
                          sni = get_param('sni') or get_param('peer') or get_param('host')
                          sec = get_param('security', 'tls')
                          
                          if sec in ['tls', 'xtls', 'reality'] or base["port"] in [443, 8443, 2053, 2083]:
                              base["skip-cert-verify"] = True
                              fp = get_param('fp') or ('chrome' if sec == 'reality' else '')
                              if fp: base["client-fingerprint"] = fp
                              if sni and not re.match(r'^[\d\.]+$', sni) and ':' not in sni: 
                                  base["sni"] = sni
                              elif u.hostname and not re.match(r'^[\d\.]+$', str(u.hostname)) and ':' not in str(u.hostname): 
                                  base["sni"] = str(u.hostname)
                              alpn = get_param('alpn')
                              if alpn: base["alpn"] = alpn.split(',')
                              
                              if sec == 'reality':
                                  base["reality-opts"] = {"public-key": get_param('pbk'), "short-id": get_param('sid')}

                          if base["network"] == "ws" or get_param('path'):
                              base["network"] = "ws"
                              path = get_param('path', '/')
                              if not path.startswith('/'): path = '/' + path
                              base["ws-opts"] = {"path": path}
                              host = get_param('host') or sni
                              if host: base["ws-opts"]["headers"] = {"Host": host}
                              if is_httpupgrade: base["ws-opts"]["v2ray-http-upgrade"] = True
                          elif base["network"] == "grpc":
                              base["grpc-opts"] = {"grpc-service-name": get_param('serviceName', '')}

                      elif u.scheme == "vless":
                          base.update({"type": "vless", "uuid": password, "network": net_type})
                          
                          pe = get_param('packetEncoding')
                          if pe: base["packet-encoding"] = pe
                          
                          sni = get_param('sni') or get_param('peer') or get_param('host')
                          sec = get_param('security', 'none')
                          
                          if sec in ['tls', 'reality'] or base["port"] in [443, 8443, 2053, 2083, 2087, 2096]:
                              base["tls"] = True
                              base["skip-cert-verify"] = True
                              fp = get_param('fp') or ('chrome' if sec == 'reality' else '')
                              if fp: base["client-fingerprint"] = fp
                              alpn = get_param('alpn')
                              if alpn: base["alpn"] = alpn.split(',')
                              
                              if sni and not re.match(r'^[\d\.]+$', sni) and ':' not in sni:
                                  base["servername"] = sni
                              elif u.hostname and not re.match(r'^[\d\.]+$', str(u.hostname)) and ':' not in str(u.hostname):
                                  base["servername"] = str(u.hostname)
                              
                              if sec == 'reality':
                                  base["reality-opts"] = {"public-key": get_param('pbk'), "short-id": get_param('sid')}
                          
                          flow = get_param('flow')
                          if flow and base.get("tls") and base["network"] == "tcp": 
                              base['flow'] = flow

                          if base["network"] == "ws":
                              path = get_param('path', '/')
                              if not path.startswith('/'): path = '/' + path
                              base["ws-opts"] = {"path": path}
                              host = get_param('host') or sni
                              if host: base["ws-opts"]["headers"] = {"Host": host}
                              if is_httpupgrade: base["ws-opts"]["v2ray-http-upgrade"] = True
                          elif base["network"] == "grpc":
                              base["grpc-opts"] = {"grpc-service-name": get_param('serviceName', '')}

                      elif u.scheme in ["hysteria2", "hy2"]:
                          sni = get_param('sni')
                          if not sni or re.match(r'^[\d\.]+$', sni) or ':' in sni:
                              sni = str(u.hostname) if (u.hostname and not re.match(r'^[\d\.]+$', str(u.hostname))) else ""
                          base.update({"type": "hysteria2", "password": password, "tls": True, "skip-cert-verify": True, "alpn": ["h3"]})
                          if sni: base["sni"] = sni
                          obfs = get_param('obfs')
                          if obfs:
                              base["obfs"] = obfs
                              obfs_pwd = get_param('obfs-password')
                              if obfs_pwd: base["obfs-password"] = obfs_pwd
                      
                      elif u.scheme == "ss":
                          user_info = ""
                          if u.username and u.password:
                              user_info = f"{urllib.parse.unquote(u.username)}:{urllib.parse.unquote(u.password)}"
                          elif u.username:
                              user_info = urllib.parse.unquote(u.username)
                          elif u.netloc and "@" not in u.netloc: 
                              try:
                                  padded = u.netloc + "=" * ((4 - len(u.netloc) % 4) % 4)
                                  decoded = base64.urlsafe_b64decode(padded).decode('utf-8')
                                  if "@" in decoded:
                                      u_new = urllib.parse.urlparse(f"ss://{decoded}")
                                      base["server"] = u_new.hostname
                                      base["port"] = int(u_new.port) if u_new.port else 0
                                      if u_new.username and u_new.password:
                                          user_info = f"{urllib.parse.unquote(u_new.username)}:{urllib.parse.unquote(u_new.password)}"
                              except: pass
                              
                          if ":" not in user_info:
                              try:
                                  padded = user_info + "=" * ((4 - len(user_info) % 4) % 4)
                                  user_info = base64.urlsafe_b64decode(padded).decode('utf-8')
                              except: pass
                              
                          if ":" in user_info:
                              method, pwd = user_info.split(":", 1)
                              method = method.lower()
                              
                              if method == "chacha20-poly1305": method = "chacha20-ietf-poly1305"
                              elif method == "xchacha20-poly1305": method = "xchacha20-ietf-poly1305"
                              
                              valid_ciphers = [
                                  "aes-128-gcm", "aes-192-gcm", "aes-256-gcm", 
                                  "aes-128-cfb", "aes-192-cfb", "aes-256-cfb", 
                                  "aes-128-ctr", "aes-192-ctr", "aes-256-ctr", 
                                  "rc4-md5", "chacha20-ietf", "xchacha20", 
                                  "chacha20-ietf-poly1305", "xchacha20-ietf-poly1305",
                                  "2022-blake3-aes-128-gcm", "2022-blake3-aes-256-gcm", 
                                  "2022-blake3-chacha20-poly1305"
                              ]
                              if method not in valid_ciphers:
                                  return None
                              
                              base.update({"type": "ss", "cipher": method, "password": pwd})
                              
                              plugin = get_param('plugin')
                              if plugin:
                                  if 'obfs' in plugin:
                                      base['plugin'] = 'obfs'
                                      base['plugin-opts'] = {'mode': 'tls' if 'obfs=tls' in plugin else 'http'}
                                      hm = re.search(r'obfs-host=([^;]+)', plugin)
                                      if hm: base['plugin-opts']['host'] = hm.group(1)
                                  elif 'v2ray-plugin' in plugin:
                                      base['plugin'] = 'v2ray-plugin'
                                      base['plugin-opts'] = {'mode': 'websocket'}
                                      if 'tls' in plugin: base['plugin-opts']['tls'] = True
                                      hm = re.search(r'host=([^;]+)', plugin)
                                      if hm: base['plugin-opts']['host'] = hm.group(1)
                                      pm = re.search(r'path=([^;]+)', plugin)
                                      if pm: base['plugin-opts']['path'] = pm.group(1)
                  
                  if not base: return None
                  if "type" not in base: return None
                  if not base.get("server") or str(base.get("server")) == "None" or len(str(base["server"])) < 4: return None
                  if not is_valid_port(base.get("port")): return None
                  if base.get("type") in ["vmess", "vless"] and (not base.get("uuid") or len(str(base["uuid"])) < 5): return None
                  if base.get("type") in ["trojan", "hysteria2", "ss"] and not base.get("password"): return None
                  if "@" in safe_link:
                      try:
                          protocol, rest = safe_link.split("://", 1)
                          userinfo, hostinfo = rest.split("@", 1) 
                          if "/" in userinfo:
                              userinfo = userinfo.replace("/", "%2F")
                              safe_link = f"{protocol}://{userinfo}@{hostinfo}"
                      except: pass
                  clean_base = remove_control_chars(base)
                  return {"config": clean_base, "link": safe_link}
              except: return None

          final_json_data = []
          final_raw_links = []
          final_pure_links = []
          name_counts = {}
          seen_global_cfgs = set()

          for deep_key, urls in node_groups.items():
              ip = deep_key_to_ip[deep_key]
              geo = ip_info.get(ip, {})
              urls.sort(key=score_link, reverse=True)
              limit_v = max_variants(urls)
              added_in_group = 0

              for url in urls:
                  if added_in_group >= limit_v:
                      break
                  raw_name = url_to_name.get(url, "")
                  pure_link = f"{url}#{raw_name}" if raw_name else url

                  cc = geo.get('countryCode')
                  country = geo.get('country')

                  if cc and country:
                      base_name = f"{get_flag(cc)} {country}"
                  else:
                      clean_name = re.sub(r'(?i)(telegram|t\.me|@)\S*', '', raw_name)
                      clean_name = re.sub(r'[\[\]\(\)]', '', clean_name)
                      base_name = clean_name.split('|')[0].split(',')[0].strip()
                      if not base_name or base_name.startswith("Node_"):
                          base_name = "🌍 Unknown"

                  next_num = name_counts.get(base_name, 0) + 1
                  node_name = f"Node_{len(final_json_data)}"
                  final_name = f"{base_name} [{next_num}]"

                  parsed_obj = parse_to_mihomo(url, node_name, final_name)
                  if parsed_obj:
                      clean_cfg = {k: v for k, v in parsed_obj["config"].items() if k != "name"}
                      cfg_sig = json.dumps(clean_cfg, sort_keys=True, ensure_ascii=False)
                      if cfg_sig in seen_global_cfgs:
                          continue
                      seen_global_cfgs.add(cfg_sig)
                      name_counts[base_name] = next_num
                      added_in_group += 1

                      parsed_obj["config"]["name"] = node_name
                      parsed_obj["meta"] = {
                          "original_name": final_name,
                          "host_ip": ip
                      }
                      final_json_data.append(parsed_obj)
                      final_raw_links.append(parsed_obj["link"])
                      final_pure_links.append(pure_link)

          print(f"🚀 Сгенерировано {len(final_json_data)} конфигов для Mihomo.")
          
          with open('proxy_lists/raw_proxies.json', 'w', encoding='utf-8') as f:
              json.dump(final_json_data, f, ensure_ascii=False, indent=2)
              
          with open('proxy_lists/raw_proxies_original.txt', 'w', encoding='utf-8') as f:
              f.write("\n".join(final_raw_links))
              
          with open('proxy_lists/raw_proxies_pure.txt', 'w', encoding='utf-8') as f:
              f.write("\n".join(final_pure_links))
          EOF
          
          python3 filter.py
          rm proxy_lists/raw_temp.txt

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync: New JSON configs ready for deep test"
          file_pattern: proxy_lists/*

      - name: Ping Phone to start RKN Check
        run: curl -d "START_TEST" ntfy.sh/${{ secrets.NTFY_TOPIC }}
